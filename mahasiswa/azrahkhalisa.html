<!DOCTYPE html>
<html>
<head>
    <title>Tabel HTML</title>
</head>
<body>

<caption>HTML TABLE</caption>
<table border="1">
    <tr>
        <th colspan="2">Cell 1</th>
        <th>Cell 2</th>
        <th>Cell 3</th>
    </tr>

    <tr>
        <td rowspan="3">Cell 4</td>
        <td>Cell 5</td>
        <td>Cell 6</td>
        <td rowspan="1">Cell 7</td>
    </tr>

    <tr>
        <td colspan="3">Cell 8</td>
    </tr>

    <tr>
        <td>Cell</td>
        <td colspan="2">Cell 9</td>
    </tr>
</table>

</body>
</html>
